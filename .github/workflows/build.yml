name: Build

on:
  pull_request:
    paths: ['Dockerfile', 'cmd/**', 'slices/**', 'packages/**', 'go.mod', 'compose*.yaml', '.github/workflows/build.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', 'cmd/**', 'slices/**', 'packages/**', 'go.mod', 'compose*.yaml', '.github/workflows/build.yml']
  schedule:
    # Weekly: picks up new runner releases and Ubuntu security updates.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      runner_version:
        description: 'actions/runner version to build (default: latest), without the "v"'
        required: false
        type: string

permissions:
  contents: read

# One run per branch or PR at a time. A new push to a PR replaces its running
# build; on main (and the weekly schedule) runs queue instead, so a publish is
# never cut short and two runs never race on the build cache or `:latest`.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERHUB_IMAGE: docker.io/meitrix8208/chiseled-runner
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Some tests need root (ghr drops to the runner user when started as root).
      - name: go test (as root)
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go test -race -count=1 ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"

  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.r.outputs.version }}
      sha_amd64: ${{ steps.r.outputs.sha_amd64 }}
      sha_arm64: ${{ steps.r.outputs.sha_arm64 }}
      e2e: ${{ steps.e2e.outputs.e2e }}
      nonce: ${{ steps.e2e.outputs.nonce }}
      archive_state: ${{ steps.archive.outputs.state }}
    steps:
      # The Ubuntu archive's state: when it publishes updates, the image's
      # package cut is redone instead of coming from the build cache (see
      # UBUNTU_ARCHIVE_STATE in the Dockerfile). Same mirror as the builds.
      - id: archive
        env:
          MIRROR: http://azure.archive.ubuntu.com/ubuntu/
        run: |
          set -euo pipefail
          dates=""
          for suite in noble noble-updates noble-security resolute resolute-updates resolute-security; do
            d=$(curl -fsS --retry 5 --retry-all-errors --max-time 60 "${MIRROR}dists/${suite}/InRelease" | sed -n 's/^Date: //p' | head -1)
            test -n "$d" || { echo "::error::no Date in ${suite}/InRelease"; exit 1; }
            echo "$suite: $d"
            dates="${dates}${suite} ${d};"
          done
          state=$(printf '%s' "$dates" | sha256sum | cut -c1-16)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "Ubuntu archive state: \`$state\`" >> "$GITHUB_STEP_SUMMARY"
      # Whether this run takes a real job on each image (see the e2e job), and
      # a nonce for its runner labels, so that no other runner can be
      # registered in advance to take that job. Fork and Dependabot PRs get no
      # secrets, so they skip it.
      - id: e2e
        env:
          E2E_ENABLED: ${{ vars.E2E_ENABLED }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          e2e=false
          if [ "$E2E_ENABLED" = true ] && [ "$FORK" = false ] && [ "$ACTOR" != 'dependabot[bot]' ]; then e2e=true; fi
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "nonce=$(openssl rand -hex 8)" >> "$GITHUB_OUTPUT"
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.runner_version }}
        run: |
          set -euo pipefail
          if [ -n "${WANT:-}" ]; then
            rel=$(gh api "repos/actions/runner/releases/tags/v${WANT}")
          else
            rel=$(gh api repos/actions/runner/releases/latest)
          fi
          version=$(jq -r .tag_name <<<"$rel"); version=${version#v}
          for pair in "x64:amd64" "arm64:arm64"; do
            arch=${pair%%:*}; out=${pair##*:}
            name="actions-runner-linux-${arch}-${version}.tar.gz"
            sha=$(jq -r --arg n "$name" '.assets[]|select(.name==$n)|.digest // ""' <<<"$rel")
            sha=${sha#sha256:}
            if [ -z "$sha" ]; then   # release without an asset digest: hash the download
              sha=$(curl -fsSL "https://github.com/actions/runner/releases/download/v${version}/${name}" | sha256sum | cut -d' ' -f1)
            fi
            echo "sha_${out}=${sha}" >> "$GITHUB_OUTPUT"
          done
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building with actions/runner ${version}" >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: [test, resolve]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [noble, resolute]
        target: [slim, docker, build, full]
    # Runs job code (the e2e runner below), so it holds no publish credentials:
    # publishing is the `publish` job, on another VM.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute names
        id: n
        run: |
          base=${{ matrix.release }}
          [ "${{ matrix.target }}" = slim ] || base="${base}-${{ matrix.target }}"
          echo "local=chiseled-runner:${base}" >> "$GITHUB_OUTPUT"

      # Build for the runner's own architecture first and test that image.
      - name: Build (amd64, for tests)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.n.outputs.local }}
          cache-from: type=gha,scope=${{ matrix.release }}-${{ matrix.target }}
          # The publish job rebuilds from this cache.
          cache-to: type=gha,scope=${{ matrix.release }}-${{ matrix.target }},mode=max
          build-args: |
            UBUNTU_RELEASE=${{ matrix.release }}
            UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/
            UBUNTU_ARCHIVE_STATE=${{ needs.resolve.outputs.archive_state }}
            RUNNER_VERSION=${{ needs.resolve.outputs.version }}
            RUNNER_SHA256_AMD64=${{ needs.resolve.outputs.sha_amd64 }}
            RUNNER_SHA256_ARM64=${{ needs.resolve.outputs.sha_arm64 }}
            VERSION=${{ github.sha }}

      - name: Smoke tests
        env:
          IMG: ${{ steps.n.outputs.local }}
        run: |
          set -euxo pipefail
          docker run --rm "$IMG" --version
          # Config resolution, with no network or GitHub involved:
          docker run --rm -e REPO_URL=https://github.com/o/r -e ACCESS_TOKEN=x "$IMG" --dry-run | tee dry-run.txt
          # Starts as root and runs the runner (and jobs) as 1001, so jobs cannot
          # read the credentials in /proc/<pid>/environ of root's processes:
          grep -q 'runner_user=1001 ' dry-run.txt
          # The .NET runtime, ICU and OpenSSL all load from the chiselled rootfs:
          docker run --rm --entrypoint /actions-runner/bin/Runner.Listener "$IMG" --version
          # Bundled Node for JavaScript actions:
          docker run --rm --entrypoint /actions-runner/externals/node24/bin/node "$IMG" -e 'console.log(process.version)'
          # Node 24 only: actions declaring node20 run on it (NODE_VERSIONS in the Dockerfile).
          docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec 'test ! -e /actions-runner/externals/node20 && echo "node20 not shipped"'
          # Tools, DNS and TLS trust:
          docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec \
            'git --version; curl --version | head -1; jq --version; tar --version | head -1; sh -c "echo sh ok"; curl -fsS -o /dev/null -w "%{http_code} %{ssl_verify_result}\n" https://github.com; git ls-remote https://github.com/actions/runner HEAD'
          # The runner's code is root's and read-only to jobs; its directory is sticky:
          docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec '
            test "$(stat -c "%U %a" /actions-runner)" = "root 1777"
            test -z "$(find /actions-runner -mindepth 1 \( ! -user root -o -perm /022 \))"
            echo "runner code immutable"'
          docker run --rm --user 1001 --entrypoint /usr/bin/bash "$IMG" -c '! mv /actions-runner/bin /actions-runner/x 2>/dev/null && echo "bin cannot be replaced"'
          # No setuid/setgid binaries:
          docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec 'test -z "$(find / -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null)" && echo "no setuid binaries"'
          # actions/checkout runs `git submodule foreach` on every checkout:
          docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec \
            'cd /tmp && git init -q t && cd t && git submodule foreach true && echo "git submodule ok"'
          if [ "${{ matrix.target }}" = full ]; then
            # A real dpkg database, and Ubuntu's own apt sources (not the
            # build's mirror) with their package lists, so `apt-get install`
            # works without an update first:
            docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec '
              dpkg-query -W libssl3t64 build-essential
              grep -Eq "^URIs: http://(archive|ports)\.ubuntu\.com/" /etc/apt/sources.list.d/ubuntu.sources
              ! grep -q azure /etc/apt/sources.list.d/ubuntu.sources
              ls /var/lib/apt/lists | grep -Eq "(archive|ports)\.ubuntu\.com"
              ! ls /var/lib/apt/lists | grep -q azure
              echo "apt ok"'
            # sudo is a shim that never raises privileges. As root
            # (RUN_AS_ROOT=true) it runs the command, like myoung34's sudo,
            # environment assignments included:
            docker run --rm --user 0 --entrypoint /usr/bin/bash "$IMG" -ec '
              sudo -E -H DEBIAN_FRONTEND=noninteractive apt-get install -y -qq hello >/dev/null
              test "$(hello)" = "Hello, world!"
              test "$(sudo -- id -u)" = 0
              test "$(sudo -u root bash -c "echo ok")" = ok
              # Clustered options, -v and -k alone, and -H setting HOME:
              sudo -EH true
              sudo -nE true
              sudo -v
              sudo -k
              test "$(HOME=/home/runner sudo -H sh -c "echo \$HOME")" = /root
              # A held package is still installed, for the runner user too:
              apt-mark hold git >/dev/null
              setpriv --reuid 1001 --regid 1001 --clear-groups sudo apt-get install -y git
              echo "sudo as root ok"'
            # As the runner user it cannot install anything...
            docker run --rm --user 1001 --entrypoint /usr/bin/bash "$IMG" -ec '
              cd /tmp
              fails() { if "$@" 2>/dev/null; then echo "unexpected success: $*"; exit 1; fi; }
              fails sudo apt-get install -y hello
              sudo apt-get -o Dpkg::Options::=--force-confold install -y hello 2> err || true
              grep -q RUN_AS_ROOT=true err
              grep -q FROM err
              grep -q "(missing: hello)" err
              fails sudo id
              fails sudo -u nobody id
              fails sudo -i
              fails sudo DEBIAN_FRONTEND=noninteractive id
              fails sudo -v
              fails sudo -Ei id
              # A version other than the installed one is not installed:
              fails sudo apt-get install -y git=0.0
              # Nor is a local .deb the image does not have:
              mkdir -p p/DEBIAN
              printf "Package: hello\nVersion: 1.0\nArchitecture: all\nMaintainer: x\nDescription: x\n" > p/DEBIAN/control
              dpkg-deb --build p hello.deb >/dev/null
              fails sudo apt-get install -y ./hello.deb
              fails apt-get install -y -qq hello
              echo "sudo as 1001 refuses"'
            # ...but an update, or packages the image already has, pass, so
            # the same workflow runs unchanged on an image built FROM -full:
            docker run --rm --user 1001 --entrypoint /usr/bin/bash "$IMG" -ec '
              codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
              sudo apt-get update
              sudo apt-get -qq update
              out=$(sudo apt-get install -y -q --no-install-recommends curl git:amd64 2>&1)
              case "$out" in *"already installed"*) ;; *) echo "$out"; exit 1 ;; esac
              sudo apt install -y git=$(dpkg-query -W -f="\${Version}" git)
              sudo apt-get -y install git
              sudo DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Options::=--force-confold -t "$codename" install -y git
              sudo -EH apt-get install -y git
              sudo apt-get install -y "git/$codename"
              # An arch qualifier on an Architecture: all package:
              sudo apt-get install -y "ca-certificates:$(dpkg --print-architecture)"
              # A local .deb of what is installed:
              cd /tmp && mkdir -p p/DEBIAN
              printf "Package: git\nVersion: %s\nArchitecture: %s\nMaintainer: x\nDescription: x\n" \
                "$(dpkg-query -W -f="\${Version}" git)" "$(dpkg --print-architecture)" > p/DEBIAN/control
              dpkg-deb --build p git.deb >/dev/null
              sudo apt-get install -y ./git.deb
              echo "sudo as 1001 passes for installed packages"'
          else
            # Package metadata, so scanners can see the Ubuntu packages:
            docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec \
              'test -s /var/lib/chisel/manifest.wall; n=$(ls /var/lib/dpkg/status.d | wc -l); echo "$n packages recorded"; test "$n" -ge 20; grep -q "^Source: openssl" /var/lib/dpkg/status.d/libssl3t64'
          fi
          # Archive tools, awk (used by many `curl | sh` installers), diff/patch, less:
          docker run --rm --user 1001 --entrypoint /usr/bin/bash "$IMG" -ec '
            cd /tmp && echo hi > f
            for z in -J --zstd -j; do tar "$z" -cf f.t f && test "$(tar "$z" -xOf f.t)" = hi; done
            zip -q f.zip f && unzip -p f.zip f >/dev/null
            test "$(echo "a b" | awk "{print \$2}")" = b
            echo hello > g; diff f g > p.diff || true; patch -s f p.diff; test "$(cat f)" = hello
            less --version | head -1
            echo "archive and text tools ok"'
          # Libraries setup-python's builds load (sqlite3, ctypes, lzma, bz2, readline, curses, dbm, uuid):
          docker run --rm --entrypoint /usr/bin/bash "$IMG" -ec '
            for l in libsqlite3.so.0 libffi.so.8 liblzma.so.5 libbz2.so.1.0 libzstd.so.1 libreadline.so.8 libncursesw.so.6 libpanelw.so.6 libtinfo.so.6 libgdbm.so.6 libgdbm_compat.so.4 libuuid.so.1; do
              ls /usr/lib/*-linux-gnu/$l >/dev/null || { echo "missing $l"; exit 1; }; done; echo "python libs ok"'
          if [ "${{ matrix.target }}" = build ] || [ "${{ matrix.target }}" = full ]; then
            # A C toolchain the runner user can use: compile, archive, link, make.
            docker run --rm --user 1001 --entrypoint /usr/bin/bash "$IMG" -ec '
              cd /tmp
              echo "#include <math.h>" > f.c
              echo "int f(double x) { return (int)sqrt(x); }" >> f.c
              echo "#include <stdio.h>" > m.c
              echo "int f(double);" >> m.c
              echo "int main(void) { puts(\"linked\"); return f(1764.0) == 42 ? 0 : 1; }" >> m.c
              # -lresolv, -lpthread, -ldl: what cgo links (net, os/user, plugin)
              cc -c f.c
              ar rcs libf.a f.o
              cc -o m m.c -L. -lf -lm -lresolv -lpthread -ldl
              ./m
              echo ".RECIPEPREFIX = >" > Makefile
              echo "all:" >> Makefile
              echo ">@echo make ok" >> Makefile
              make
              echo "toolchain ok"'
          fi
          if [ "${{ matrix.target }}" = full ]; then
            # C++ and pkg-config, which the chisel slices do not have:
            docker run --rm --user 1001 --entrypoint /usr/bin/bash "$IMG" -ec '
              cd /tmp
              echo "#include <string>" > a.cc
              echo "int main() { return std::string(\"ok\").size() == 2 ? 0 : 1; }" >> a.cc
              g++ -o a a.cc
              ./a
              pkg-config --version
              python3 --version
              echo "c++ ok"'
          fi
          if [ "${{ matrix.target }}" = docker ] || [ "${{ matrix.target }}" = full ]; then
            docker run --rm --entrypoint /usr/local/bin/docker "$IMG" --version
            docker run --rm --user 1001 --entrypoint /usr/local/bin/docker "$IMG" buildx version
            docker run --rm --user 1001 --entrypoint /usr/local/bin/docker "$IMG" compose version
          fi
          size=$(docker image inspect "$IMG" --format '{{.Size}}')
          echo "| ${{ matrix.release }} / ${{ matrix.target }} | $((size/1024/1024)) MB (amd64) |" >> "$GITHUB_STEP_SUMMARY"

      - name: docker compose --scale gives each replica its own runner name
        if: matrix.target == 'slim'
        env:
          RUNNER_IMAGE: ${{ steps.n.outputs.local }}
          RESTART_POLICY: 'no'
          GHR_DRY_RUN: 'true'
          REPO_URL: https://github.com/o/r
          ACCESS_TOKEN: x
          RUNNER_SCOPE: repo
        run: |
          set -euo pipefail
          docker compose up --scale runner=3
          n=$(docker compose logs --no-log-prefix | grep -o ' name=[^ ]*' | sort -u | wc -l)
          docker compose down
          test "$n" -eq 3 || { echo "expected 3 distinct runner names, got $n"; exit 1; }

      # A real job on this image: the e2e job below. The container only gets a
      # registration token (valid 1 h, good for registering runners and nothing
      # else); the App token that mints it is revoked before the job starts.
      # On -docker variants the job can reach the host through the socket, so
      # it could read that registration token too: see docs/Security.md.
      - name: e2e token
        id: app
        if: needs.resolve.outputs.e2e == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.E2E_APP_CLIENT_ID }}   # a repository variable: not secret
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          permission-administration: write
          skip-token-revoke: true   # the next step revokes it

      - name: e2e runner (a real job on this image)
        if: needs.resolve.outputs.e2e == 'true'
        env:
          IMG: ${{ steps.n.outputs.local }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          LABEL: ghr-e2e-${{ needs.resolve.outputs.nonce }}-${{ matrix.release }}-${{ matrix.target }}
          NAME: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.release }}-${{ matrix.target }}
          JOB: e2e (${{ matrix.release }}, ${{ matrix.target }})
          E2E_TIMEOUT: '900'
        run: |
          set -euo pipefail
          revoke() { gh api -X DELETE installation/token >/dev/null 2>&1 || true; }
          trap revoke EXIT
          RUNNER_TOKEN=$(gh api -X POST "repos/${{ github.repository }}/actions/runners/registration-token" --jq .token)
          echo "::add-mask::$RUNNER_TOKEN"
          revoke; trap - EXIT; unset GH_TOKEN
          export RUNNER_TOKEN
          docker_args=()
          if [ "${{ matrix.target }}" = docker ]; then
            # Same setup as compose.docker.yaml: host socket, its group, and a work
            # directory at the same path on both sides, owned by the runner user.
            sudo install -d -o 1001 -g 1001 /tmp/runners
            docker_args=(-v /var/run/docker.sock:/var/run/docker.sock
                         --group-add "$(stat -c %g /var/run/docker.sock)"
                         -v /tmp/runners:/tmp/runners -e RUNNER_WORKDIR_ROOT=/tmp/runners)
          fi
          # -full runs the way a myoung34 migrant would start it: jobs as root,
          # so workflows' `sudo apt-get install` works (smoke tests cover 1001).
          if [ "${{ matrix.target }}" = full ]; then
            docker_args=(-e RUN_AS_ROOT=true)
          fi
          docker run -d --init --name e2e "${docker_args[@]}" \
            -e RUNNER_TOKEN \
            -e REPO_URL="https://github.com/${{ github.repository }}" \
            -e LABELS="$LABEL" -e NO_DEFAULT_LABELS=true \
            -e EPHEMERAL=true -e DISABLE_AUTO_UPDATE=true \
            -e RUNNER_NAME="$NAME" -e RUNNER_NAME_SUFFIX=none \
            "$IMG" >/dev/null
          code=$(timeout "$E2E_TIMEOUT" docker wait e2e || echo timeout)
          docker stop -t 60 e2e >/dev/null 2>&1 || true
          docker logs -t e2e > e2e.log 2>&1
          echo "::group::runner log"; cat e2e.log; echo "::endgroup::"
          # The job this runner took must be this variant's e2e job, and it must
          # have passed. grep a file, not a pipe: with pipefail, grep -q closing
          # early fails the pipe.
          ok=no
          grep -qF "Running job: $JOB" e2e.log && grep -qF "Job $JOB completed with result: Succeeded" e2e.log && ok=yes
          echo "runner exit: $code, $JOB succeeded on this runner: $ok"
          # Startup on a Linux host: container start -> listening -> job picked up.
          at() { grep -m1 "$1" e2e.log | cut -d' ' -f1 || true; }
          secs() { [ -n "$1" ] && [ -n "$2" ] && echo "$(( $(date -d "$2" +%s%3N) - $(date -d "$1" +%s%3N) ))" | awk '{printf "%.1f s", $1/1000}' || echo "-"; }
          started=$(docker inspect -f '{{.State.StartedAt}}' e2e)
          listening=$(at 'Listening for Jobs'); picked=$(at 'Running job')
          echo "| ${{ matrix.release }} / ${{ matrix.target }} | start to listening: $(secs "$started" "$listening") | listening to job picked up: $(secs "$listening" "$picked") |" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$code" = 0 ] && [ "$ok" = yes ]

      # Also when the step above failed or the run was cancelled mid-wait. With
      # only a registration token ghr cannot deregister itself, so a runner that
      # did not finish its one job is deleted here, with a fresh App token.
      - name: e2e cleanup token
        id: cleanup
        if: always() && needs.resolve.outputs.e2e == 'true' && steps.app.outcome == 'success'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.E2E_APP_CLIENT_ID }}   # a repository variable: not secret
          private-key: ${{ secrets.E2E_APP_PRIVATE_KEY }}
          permission-administration: write
      - name: Remove the e2e runner
        if: always() && steps.cleanup.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.cleanup.outputs.token }}
          NAME: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.release }}-${{ matrix.target }}
        run: |
          set -uo pipefail
          if docker inspect e2e >/dev/null 2>&1; then
            docker stop -t 60 e2e >/dev/null 2>&1 || true
            docker logs --tail 5 e2e 2>&1 || true
            docker rm -f e2e >/dev/null 2>&1 || true
          fi
          # A runner stopped mid-job can stay "busy" for a moment: retry, and
          # fail the step (visibly) only if it is still registered at the end.
          for attempt in 1 2 3 4 5 6; do
            ids=$(gh api --paginate "repos/${{ github.repository }}/actions/runners?per_page=100" \
              --jq ".runners[] | select(.name == \"$NAME\") | .id") || ids=unknown
            [ -z "$ids" ] && exit 0
            for id in $ids; do
              [ "$id" = unknown ] && break
              echo "deleting runner $NAME ($id), attempt $attempt"
              gh api -X DELETE "repos/${{ github.repository }}/actions/runners/$id" || true
            done
            sleep 10
          done
          echo "::error::runner $NAME is still registered; delete it in Settings > Actions > Runners"
          exit 1

  # Runs on the runner that the `image` job starts from the image it just built.
  # Queued from the start; its only label is unique to this run and variant.
  e2e:
    # Also on test: when the tests fail, no image job starts a runner, so the
    # e2e jobs must be skipped rather than queued (the run then ends failed,
    # not cancelled).
    needs: [test, resolve]
    if: needs.resolve.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        release: [noble, resolute]
        target: [slim, docker, build, full]
    runs-on: ["ghr-e2e-${{ needs.resolve.outputs.nonce }}-${{ matrix.release }}-${{ matrix.target }}"]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: an action that declares node20 runs on Node 24
        uses: ./.github/actions/node20-probe
      - name: hashFiles (the runner's internal Node)
        run: |
          h='${{ hashFiles('go.mod') }}'
          echo "hash=$h"; test -n "$h"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node --version
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: python stdlib modules that need system libraries
        run: python -c "import ssl, sqlite3, ctypes, lzma, bz2, zlib, readline, curses, dbm.gnu, uuid; print('python ok')"
      - name: runner credentials are not visible to job steps
        run: test -z "${RUNNER_TOKEN:-}${APP_PRIVATE_KEY:-}${APP_ID:-}${ACCESS_TOKEN:-}" && echo "no credentials in env"
      - name: myoung34-style sudo apt-get install (RUN_AS_ROOT=true)
        if: matrix.target == 'full'
        run: |
          test "$(id -u)" = 0
          sudo apt-get install -y hello
          hello
      - name: git submodule (used by actions/checkout)
        run: git submodule status && echo "submodule ok"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        if: matrix.target == 'build' || matrix.target == 'full'
        with:
          toolchain: stable
      - name: cargo builds and links a crate with C code (cc crate)
        if: matrix.target == 'build' || matrix.target == 'full'
        run: |
          cargo new -q /tmp/hello && cd /tmp/hello
          mkdir -p csrc
          echo 'int forty_one(void) { return 41; }' > csrc/f.c
          cargo add -q --build cc
          echo 'fn main() { cc::Build::new().file("csrc/f.c").compile("f"); }' > build.rs
          echo 'unsafe extern "C" { fn forty_one() -> i32; }' > src/main.rs
          echo 'fn main() { println!("{}", unsafe { forty_one() } + 1); }' >> src/main.rs
          test "$(cargo run -q)" = 42 && echo "cargo + cc ok"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.target == 'build' || matrix.target == 'full'
        with:
          go-version-file: go.mod
          cache: false
      - name: go test -race (cgo)
        if: matrix.target == 'build' || matrix.target == 'full'
        run: go test -race -count=1 ./...
      - name: docker jobs use the host daemon
        if: matrix.target == 'docker'
        run: docker run --rm hello-world | grep 'Hello from Docker!'
      - name: bind mounts of the workspace resolve on the host
        if: matrix.target == 'docker'
        run: |
          echo ok > probe
          test "$(docker run --rm -v "$GITHUB_WORKSPACE:/w" busybox cat /w/probe)" = ok && echo "workspace mount ok"

  # An e2e job whose image job failed before starting its runner would wait
  # for a runner forever. Every image job (and so every e2e runner) is done
  # here: cancel the run only if an e2e job is still waiting.
  cancel-orphans:
    needs: [test, resolve, image]
    if: always() && needs.resolve.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          waiting=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
            --jq '.jobs[] | select((.name | startswith("e2e (")) and (.status | test("^(queued|waiting|pending|requested)$"))) | .name')
          if [ -n "$waiting" ]; then
            echo "::error::no runner will come for: $(echo "$waiting" | paste -sd, -); cancelling the run (the cause is in the failed image job)"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel" >/dev/null || true   # already cancelling (e.g. cancelled by hand)
          fi

  publish:
    needs: [resolve, image, e2e]
    # e2e is skipped only when it is not enabled for this run.
    if: >-
      !cancelled() && github.event_name != 'pull_request' && needs.image.result == 'success' &&
      (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && needs.resolve.outputs.e2e != 'true'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: [noble, resolute]
        target: [slim, docker, build, full]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute tags
        id: n
        run: |
          v=${{ needs.resolve.outputs.version }}
          base=${{ matrix.release }}
          [ "${{ matrix.target }}" = slim ] || base="${base}-${{ matrix.target }}"
          {
            echo 'tags<<EOF'
            for img in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
              echo "${img}:${base}"
              echo "${img}:${base}-${v}"
              [ "$base" = noble ] && echo "${img}:latest"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Same inputs as the tested build; the amd64 layers come from its cache.
      - name: Publish (multi-arch, with SBOM and provenance)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.n.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.release }}-${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.release }}-${{ matrix.target }},mode=max
          build-args: |
            UBUNTU_RELEASE=${{ matrix.release }}
            UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu/
            UBUNTU_ARCHIVE_STATE=${{ needs.resolve.outputs.archive_state }}
            RUNNER_VERSION=${{ needs.resolve.outputs.version }}
            RUNNER_SHA256_AMD64=${{ needs.resolve.outputs.sha_amd64 }}
            RUNNER_SHA256_ARM64=${{ needs.resolve.outputs.sha_arm64 }}
            VERSION=${{ github.sha }}

      - name: Attest build provenance (GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  keepalive:
    # Scheduled workflows are disabled after 60 days without repository activity.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
