name: e2e (local runner)
# Temporary: two jobs taken by one locally started container, restarted in between.
on:
  push:
    branches: [feat/clean-start]
    paths: ['.github/workflows/e2e-local.yml']
permissions:
  contents: read
jobs:
  plant:
    runs-on: [ghr-clean]
    steps:
      - name: leave traces everywhere the runner user can write
        run: |
          set -x
          sha256sum /actions-runner/bin/Runner.Listener | tee /tmp/sha
          echo 'echo POISONED' >> ~/.bashrc
          mkdir -p /opt/hostedtoolcache/node/99.0.0/x64 && touch /opt/hostedtoolcache/node/99.0.0/x64/node
          touch /_work/marker /tmp/marker /var/tmp/marker "$GITHUB_WORKSPACE/../marker"
          touch /actions-runner/evil
          if echo x > /actions-runner/bin/Runner.Listener 2>/dev/null; then echo "::error::runner binary writable"; exit 1; fi
          if mv /actions-runner/bin /actions-runner/bin.old 2>/dev/null; then echo "::error::bin movable"; exit 1; fi
          echo "traces planted; runner code is read-only"
  check:
    needs: plant
    runs-on: [ghr-clean]
    steps:
      - name: nothing from the previous job is left
        run: |
          left=0
          for p in ~/.bashrc /opt/hostedtoolcache/node /_work/marker /tmp/marker /tmp/sha /var/tmp/marker /actions-runner/evil "$GITHUB_WORKSPACE/../marker"; do
            if [ -e "$p" ]; then echo "::error::left behind: $p"; left=1; fi
          done
          grep -q POISONED ~/.bashrc 2>/dev/null && { echo "::error::~/.bashrc poisoned"; left=1; }
          ls -la /actions-runner
          test "$left" = 0 && echo "clean start: nothing left"
